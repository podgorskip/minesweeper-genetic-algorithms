[project]
name = "minesweeper"
version = "0.1.0"
description = "Evolving solvable Minesweeper boards"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["minesweeper"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.8",
    "pytest-timeout>=2.4.0",
]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests", "examples"]
mypy_path = "src"
explicit_package_bases = true
disallow_incomplete_defs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I"]
